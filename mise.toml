# Tool versions for this project. Run `mise install` once after cloning.
# https://mise.jdx.dev
[tools]
java     = "temurin-17"
maven    = "3.9.9"
node     = "20"
task     = "3.39.2"

[env]
# Quarkus expects JAVA_HOME; mise sets it automatically when java is the
# active tool, but we make it explicit for sub-processes.
MAVEN_OPTS = "-Xmx1g"
