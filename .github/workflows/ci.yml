name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "temurin"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Quarkus / Maven
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Quarkus, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["25"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify Maven settings
        run: mvn -B -version

      - name: Unit + integration tests
        run: mvn -B -ntp -e test
        env:
          MAVEN_OPTS: "-Xmx2g"

      - name: Dump Surefire failure logs (on test failure only)
        if: failure()
        run: |
          echo "=== Failed test reports ==="
          for f in target/surefire-reports/*.txt; do
            grep -l "FAILURE\|ERROR\|<<<" "$f" 2>/dev/null && \
              echo "--- $f ---" && cat "$f"
          done

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports-java${{ matrix.java }}
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Package runner JAR (separate so any augmentation failure is obvious)
        run: mvn -B -ntp -e -DskipTests package
        env:
          MAVEN_OPTS: "-Xmx2g"

      - name: Upload Quarkus runner JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: |
            backend/target/quarkus-app
            backend/target/*-runner.jar
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Frontend: Angular
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Angular, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (production)
        run: npm run build

      - name: Unit tests (Vitest, jsdom)
        run: npm test

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # End-to-end smoke test (curl against the running Quarkus backend)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright + UI)
    runs-on: ubuntu-latest
    needs: [backend]
    # Spin up a real PostgreSQL so the e2e covers the %prod datasource path
    # rather than dev's local H2 file. The runner JAR defaults to the prod
    # profile, which is exactly what we want to exercise here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: approval
          POSTGRES_USER: approval
          POSTGRES_PASSWORD: approval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U approval -d approval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/approval
      DB_USER: approval
      DB_PASSWORD: approval
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build runner JAR
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Start Quarkus
        working-directory: backend
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid
          for i in {1..90}; do
            # /api/requests responds 200 with an empty list once the app is ready.
            if curl -fsS http://localhost:8080/api/requests >/dev/null 2>&1; then
              echo "Quarkus is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Quarkus failed to start within timeout"; tail -200 quarkus.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run e2e

      - name: Stop Quarkus
        if: always()
        working-directory: backend
        run: |
          if [ -f quarkus.pid ]; then
            kill "$(cat quarkus.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results (videos / traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Quarkus log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-quarkus-log
          path: backend/quarkus.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Aggregated gate so branch protection only needs one required check.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
