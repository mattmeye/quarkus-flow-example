name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Skip on PRs from forks (no access to the Advisory Database for the
    # base repository) and keep the job advisory rather than gating: the
    # action requires the GitHub Dependency Graph to be enabled under
    # Settings -> Security -> Dependency graph, which is a repo-admin
    # setting that this workflow cannot itself turn on.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          # Block only on critical CVEs. Moderate-severity advisories such as
          # uuid <11.1.1 (GHSA-w5hq-g745-h8pq) are pulled in transitively via
          # @angular-devkit/build-angular -> webpack-dev-server -> sockjs and
          # have no available fix yet; surfacing them as PR noise is not
          # actionable in this repo.
          fail-on-severity: critical
          comment-summary-in-pr: always
