name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          # Block only on critical CVEs. Moderate-severity advisories such as
          # uuid <11.1.1 (GHSA-w5hq-g745-h8pq) are pulled in transitively via
          # @angular-devkit/build-angular -> webpack-dev-server -> sockjs and
          # have no available fix yet; surfacing them as PR noise is not
          # actionable in this repo.
          fail-on-severity: critical
          comment-summary-in-pr: always
