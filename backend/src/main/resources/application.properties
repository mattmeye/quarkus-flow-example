quarkus.application.name=approval-flow

# HTTP
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Quarkus Flow
quarkus.flow.tracing.enabled=false

# Datasource: H2 file-based by default so workflow / app state survives
# JVM restarts even without a separate DB. Switch to Postgres in prod by
# overriding quarkus.datasource.db-kind + jdbc.url + username/password.
quarkus.datasource.db-kind=h2
# Default H2 dialect (no PostgreSQL MODE): quarkus-flow-jpa uses TINYINT
# columns which H2's PostgreSQL compatibility mode rejects.
quarkus.datasource.jdbc.url=jdbc:h2:file:./.h2/approval;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# Production profile: Postgres. Override URL/credentials via env vars at deploy time.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/approval}
%prod.quarkus.datasource.username=${DB_USER:approval}
%prod.quarkus.datasource.password=${DB_PASSWORD:approval}
%prod.quarkus.hibernate-orm.schema-management.strategy=update

# Test profile: in-memory H2 (no PostgreSQL mode), dropped + recreated
# per Quarkus boot so the suite is hermetic.
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:approval-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# HumanTask deadlines (ISO-8601 durations). The reminder fires once
# `reminder.offset-fraction` of the timeout has elapsed (default 0.75
# -> 25% of the window remains before expiry).
app.task.confirmation.timeout=PT24H
app.task.approval.timeout=PT48H
app.task.reminder.offset-fraction=0.75
app.task.sweep.every=1s

# Test profile: keep deadlines long enough that the existing happy/reject
# tests are never racy, but run the sweep frequently so a dedicated
# expiry test (which overrides the deadlines via its own profile) sees
# transitions within a second.
%test.app.task.confirmation.timeout=PT60S
%test.app.task.approval.timeout=PT60S
%test.app.task.sweep.every=200ms

# Logging
quarkus.log.console.level=INFO
quarkus.log.category."com.example.approval".level=DEBUG
