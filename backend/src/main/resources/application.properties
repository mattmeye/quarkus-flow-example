quarkus.application.name=approval-flow

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Quarkus Flow
quarkus.flow.tracing.enabled=false

# HumanTask deadlines (ISO-8601 durations). The reminder fires once
# `reminder.offset-fraction` of the timeout has elapsed (default 0.75
# -> 25% of the window remains before expiry).
app.task.confirmation.timeout=PT24H
app.task.approval.timeout=PT48H
app.task.reminder.offset-fraction=0.75
app.task.sweep.every=1s

# Test profile: keep deadlines long enough that the existing happy/reject
# tests are never racy, but run the sweep frequently so a dedicated
# expiry test (which overrides the deadlines via its own profile) sees
# transitions within a second.
%test.app.task.confirmation.timeout=PT60S
%test.app.task.approval.timeout=PT60S
%test.app.task.sweep.every=200ms

# Logging
quarkus.log.console.level=INFO
quarkus.log.category."com.example.approval".level=DEBUG
