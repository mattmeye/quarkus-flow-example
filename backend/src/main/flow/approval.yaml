#
# CNCF Serverless Workflow DSL 1.0.0 - Reference definition of the
# task-based approval flow. Every async wait step is modelled as a
# generic "human task" managed by TaskService; the runtime source of
# truth lives in ApprovalWorkflow.java.
#
document:
  dsl: 1.0.0
  namespace: approval-demo
  name: approval
  version: 0.2.0

do:
  # ----- Stage 0: email + terms confirmation -----
  - awaitConfirmationTask:
      call: function
      with:
        name: createAndAwaitTask
        type: CONFIRMATION
        assignee: REQUESTER
        name: 'Confirm email & accept terms'
      then: evaluateConfirmation

  - evaluateConfirmation:
      switch:
        - confirmed:
            when: '.outcome == "CONFIRMED"'
            then: awaitGroup1Task
        - declined:
            when: '.outcome == "CANCELLED"'
            then: rejected

  # ----- Stage 1: approval group 1 -----
  - awaitGroup1Task:
      call: function
      with:
        name: createAndAwaitTask
        type: APPROVAL
        assignee: GROUP_1
        name: 'Approval by group 1'
      then: evaluateGroup1

  - evaluateGroup1:
      switch:
        - approved:
            when: '.outcome == "APPROVED"'
            then: awaitGroup2Task
        - rejected:
            when: '.outcome == "REJECTED"'
            then: rejected

  # ----- Stage 2: approval group 2 -----
  - awaitGroup2Task:
      call: function
      with:
        name: createAndAwaitTask
        type: APPROVAL
        assignee: GROUP_2
        name: 'Approval by group 2'
      then: evaluateGroup2

  - evaluateGroup2:
      switch:
        - approved:
            when: '.outcome == "APPROVED"'
            then: approved
        - rejected:
            when: '.outcome == "REJECTED"'
            then: rejected

  - approved:
      call: function
      with:
        name: finalize
        outcome: APPROVED
      then: end

  - rejected:
      call: function
      with:
        name: finalize
        outcome: REJECTED
      then: end
